<!DOCTYPE html>
<html lang="en">

<head>


    <title>LoanPredict.AI - Loan Prediction</title>

    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #60a5fa,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #a78bfa,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #1e3a8a,
                    #4f46e5
                );

            color: #1f2937;

            padding: 35px 20px;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            width: 100%;
            max-width: 1050px;

            margin: auto;

            background: rgba(255, 255, 255, 0.97);

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            text-align: center;

            margin-bottom: 30px;
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.3);
        }


        .header h1 {
            font-size: 34px;

            color: #1e1b4b;

            margin-bottom: 8px;
        }


        .header h1::after {
            content: "";
        }


        .header p {
            color: #6b7280;

            font-size: 15px;
        }


        /* =========================================
           AI BADGE
        ========================================= */

        .ai-badge {
            display: inline-block;

            margin-top: 15px;

            padding: 8px 16px;

            border-radius: 30px;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 12px;

            font-weight: bold;
        }


        /* =========================================
           FORM GRID
        ========================================= */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {
            display: flex;

            flex-direction: column;
        }


        .form-group label {
            font-weight: bold;

            color: #374151;

            margin-bottom: 8px;

            font-size: 14px;
        }


        /* =========================================
           INPUT & SELECT
        ========================================= */

        input,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #f9fafb;

            color: #111827;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }


        input::placeholder {
            color: #9ca3af;
        }


        input:focus,
        select:focus {

            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.12);
        }


        /* =========================================
           PREDICT BUTTON
        ========================================= */

        button {

            width: 100%;

            margin-top: 28px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.3);
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 30px
                rgba(79, 70, 229, 0.4);
        }


        /* =========================================
           HISTORY BUTTON
        ========================================= */

        .history-button {

            display: block;

            width: 100%;

            margin-top: 15px;

            padding: 14px;

            text-align: center;

            text-decoration: none;

            border-radius: 12px;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 15px;

            font-weight: bold;

            border: 1px solid #c7d2fe;

            transition: 0.3s;
        }


        .history-button:hover {

            background: #4f46e5;

            color: white;

            transform: translateY(-2px);
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            margin-top: 22px;

            color: #9ca3af;

            font-size: 11px;
        }


        /* =========================================
           INFO SECTION
        ========================================= */

        .info-section {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 25px;
        }


        .info-card {

            padding: 16px;

            text-align: center;

            background: #f8f9ff;

            border: 1px solid #e5e7eb;

            border-radius: 12px;
        }


        .info-card strong {

            display: block;

            color: #4f46e5;

            font-size: 20px;

            margin-bottom: 5px;
        }


        .info-card span {

            color: #6b7280;

            font-size: 11px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 25px 18px;

                border-radius: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .form-grid {
                grid-template-columns: 1fr;

                gap: 15px;
            }

            .info-section {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <div class="icon">
            🤖
        </div>

        <h1>
            LoanPredict.AI
        </h1>

        <p>
            Smart Loan Eligibility Prediction System
        </p>

        <div class="ai-badge">
            ✨ Powered by Machine Learning
        </div>

    </div>


    <!-- =====================================
         FORM
    ====================================== -->

    <form action="/predict" method="POST">


        <div class="form-grid">


            <!-- Gender -->

            <div class="form-group">

                <label>Gender</label>

                <select name="Gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>


            <!-- Married -->

            <div class="form-group">

                <label>Married</label>

                <select name="Married" required>

                    <option value="">
                        Select
                    </option>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <!-- Dependents -->

            <div class="form-group">

                <label>Dependents</label>

                <select name="Dependents" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        0
                    </option>

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3+">
                        3+
                    </option>

                </select>

            </div>


            <!-- Education -->

            <div class="form-group">

                <label>Education</label>

                <select name="Education" required>

                    <option value="">
                        Select
                    </option>

                    <option value="Graduate">
                        Graduate
                    </option>

                    <option value="Not Graduate">
                        Not Graduate
                    </option>

                </select>

            </div>


            <!-- Self Employed -->

            <div class="form-group">

                <label>Self Employed</label>

                <select name="Self_Employed" required>

                    <option value="">
                        Select
                    </option>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <!-- Applicant Income -->

            <div class="form-group">

                <label>
                    Applicant Income
                </label>

                <input
                    type="number"
                    name="ApplicantIncome"
                    placeholder="Example: 50000"
                    min="0"
                    required>

            </div>


            <!-- Coapplicant Income -->

            <div class="form-group">

                <label>
                    Coapplicant Income
                </label>

                <input
                    type="number"
                    name="CoapplicantIncome"
                    placeholder="Example: 20000"
                    min="0"
                    required>

            </div>


            <!-- Loan Amount -->

            <div class="form-group">

                <label>
                    Loan Amount
                </label>

                <input
                    type="number"
                    name="LoanAmount"
                    placeholder="Example: 200"
                    min="0"
                    required>

            </div>


            <!-- Loan Term -->

            <div class="form-group">

                <label>
                    Loan Term (Months)
                </label>

                <input
                    type="number"
                    name="Loan_Amount_Term"
                    placeholder="Example: 360"
                    min="1"
                    required>

            </div>


            <!-- Credit History -->

            <div class="form-group">

                <label>
                    Credit History
                </label>

                <select
                    name="Credit_History"
                    required>

                    <option value="">
                        Select
                    </option>

                    <option value="1">
                        Good
                    </option>

                    <option value="0">
                        Not Good
                    </option>

                </select>

            </div>


            <!-- Property Area -->

            <div class="form-group">

                <label>
                    Property Area
                </label>

                <select
                    name="Property_Area"
                    required>

                    <option value="">
                        Select Area
                    </option>

                    <option value="Urban">
                        Urban
                    </option>

                    <option value="Semiurban">
                        Semiurban
                    </option>

                    <option value="Rural">
                        Rural
                    </option>

                </select>

            </div>


        </div>


        <!-- =====================================
             PREDICT BUTTON
        ====================================== -->

        <button type="submit">

            🔍 Predict Loan Status

        </button>


        <!-- =====================================
             HISTORY BUTTON
        ====================================== -->

    <a href="/history" class="history-button">
    📊 View Prediction History
</a>

    </form>


    <!-- =====================================
         INFO CARDS
    ====================================== -->

    <div class="info-section">

        <div class="info-card">

            <strong>
                11
            </strong>

            <span>
                Input Features
            </span>

        </div>


        <div class="info-card">

            <strong>
                🌲
            </strong>

            <span>
                Random Forest Model
            </span>

        </div>


        <div class="info-card">

            <strong>
                ⚡
            </strong>

            <span>
                Instant Prediction
            </span>

        </div>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <div class="footer">

        <p>
            LoanPredict.AI • AI & Machine Learning Project
        </p>

    </div>


</div>

</body>

</html>
